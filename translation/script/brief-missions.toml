[[briefing]]
block = "missions"
offset = 0x0DD0
index = [17]
jp = [
  "　　　―タイフーン作戦―",
  "本年度最後の決戦は敵を壊滅させる",
  "であろう。諸君は、かつてのフン族",
  "モンゴル族の襲来と同じくらいの危",
  "難を、ヨーロッパのはるか遠くに退",
  "けるのである。すでに敵は全滅し、",
  "二度と立ち上がれないであろう。",
  "同盟",
  "Ｒ１―グーデリアン",
]
en = [
  "^- Operation Typhoon -",
  "This year's last great battle will destroy the enemy. You will drive from Europe a danger as great as the invasions of the Huns and Mongols long ago.",
  "The enemy is already beaten and will never rise again.",
  "<keep>",
  "Allies:",
  "R1 - Guderian",
]

[[briefing]]
block = "missions"
offset = 0x0EA3
index = [18]
jp = [
  "　　　―タイフーン作戦―",
  "本年度最後の決戦は敵を壊滅させる",
  "であろう。諸君は、かつてのフン族",
  "モンゴル族の襲来と同じくらいの危",
  "難を、ヨーロッパのはるか遠くに退",
  "けるのである。すでに敵は全滅し、",
  "二度と立ち上がれないであろう。",
  "同盟",
  "Ｒ１―ヘープナー",
]
en = [
  "^- Operation Typhoon -",
  "This year's last great battle will destroy the enemy. You will drive from Europe a danger as great as the invasions of the Huns and Mongols long ago.",
  "The enemy is already beaten and will never rise again.",
  "<keep>",
  "Allies:",
  "R1 - Hoepner",
]

[[briefing]]
block = "missions"
offset = 0x0F75
index = [19]
jp = [
  "冬期到来以前の最重要任務は、モス",
  "クワ攻略にあらずして、クリミヤ半",
  "島占領、ドニェツ盆地工業地帯及び",
  "炭田地帯の確保、そしてカフカス油",
  "田からの石油補給路の遮断なり。",
  "最終目標は、ドン河畔ロストフの占",
  "領にある。",
  "同盟",
  "Ｇ１―ルーマニア",
]
en = [
  "The most important task before winter is not the capture of Moscow, but to take the Crimea, secure the industrial and coal region of the Donets basin and cut the oil supply from the Caucasus.",
  "The final objective is Rostov on the Don.",
  "<keep>",
  "Allies:",
  "G1 - Romania",
]

[[briefing]]
block = "missions"
offset = 0x102E
index = [20]
jp = [
  "　　　　総統訓令第４１号",
  "　　　　―ブラウ作戦―",
  "ロシアにおける冬期戦終わりも近い。",
  "泥ねい期終了後の陸空軍の第一の任",
  "務は、主作戦遂行の条件をととのえ",
  "るため、クリミヤのケルチ半島の敵",
  "兵力を撃破、セバストポリを落とす",
  "事なり。",
  "同盟",
  "Ｒ１―ルーマニア",
]
en = [
  "^Führer Directive No. 41",
  "^- Operation Blue -",
  "The winter battle in Russia is nearing its end.",
  "Once the muddy season is over, the first task of army and air force is to prepare the main operation: destroy the enemy on the Kerch peninsula in the Crimea and take Sevastopol.",
  "<keep>",
  "Allies:",
  "R1 - Romania",
]

[[briefing]]
block = "missions"
offset = 0x10F0
index = [21]
jp = [
  "　　　　総統訓令第４１号",
  "　　　　―ブラウ作戦―",
  "ロシアにおける冬期戦終わりも近い。",
  "全兵力を南部作戦の主要に向け、ド",
  "ン前面の敵を撃破し、ついでコーカ",
  "サス地区の油田及びコーカサス山脈",
  "の道路を奪取するものとす。",
  "同盟",
  "Ｒ１―ヴァイクス　ＡＧ",
  "Ｒ２―ルーマニア",
]
en = [
  "^Führer Directive No. 41",
  "^- Operation Blue -",
  "The winter battle in Russia is nearing its end.",
  "All available forces are to be concentrated on the main operation in the south: destroy the enemy before the Don, then seize the Caucasus oilfields and the passes through the Caucasus mountains.",
  "<keep>",
  "Allies:",
  "R1 - Weichs AG",
  "R2 - Romania",
]

[[briefing]]
block = "missions"
offset = 0x11B2
index = [22]
jp = [
  "　―ヴィンターシュツルム作戦―",
  "ソ連軍の冬期攻勢―ウラヌス作戦が",
  "ドン川沿いに開始された。スターリ",
  "ングラードにあるパウルス将軍率い",
  "る第６軍の両翼より敵は突破、同軍",
  "は包囲されつつある。貴下のドン軍",
  "集団は第６軍を救出、戦線保持せよ。",
  "同盟",
  "Ｙ１―パウルスＡｒｍｙ",
  "Ｙ２―ルーマニア",
]
en = [
  "^- Operation Winter Storm -",
  "The Soviet winter offensive, Operation Uranus, has begun along the Don. The enemy has broken through on both flanks of General Paulus' Sixth Army at Stalingrad, which is being encircled.",
  "Your Army Group Don will relieve the Sixth Army and hold the front.",
  "<keep>",
  "Allies:",
  "Y1 - Paulus Army",
  "Y2 - Romania",
]

[[briefing]]
block = "missions"
offset = 0x1286
index = [23]
jp = [
  "ソ連軍は冬期攻勢の次の作戦―サタ",
  "ーン作戦を開始した。ドン川中流の",
  "伊第８軍は崩壊、敵はロストフ及び",
  "ハリコフに向け、進撃しつつある。",
  "ロストフの喪失は、コーカサスの第",
  "１装甲軍全滅につながる。全力をも",
  "って、敵の侵攻を阻止せよ。",
  "同盟",
  "Ｙ１―ヴァイクスＡＧ",
  "Ｙ２―ハンガリー",
]
en = [
  "The Soviets have begun the next stage of their winter offensive, Operation Saturn. The Italian Eighth Army on the middle Don has collapsed, and the enemy is advancing on Rostov and Kharkov.",
  "The loss of Rostov would mean the destruction of the First Panzer Army in the Caucasus. Stop the enemy advance with all your strength.",
  "<keep>",
  "Allies:",
  "Y1 - Weichs AG",
  "Y2 - Hungary",
]

[[briefing]]
block = "missions"
offset = 0x135A
index = [24]
jp = [
  "　　　　―チタデレ作戦―",
  "私は本年度の攻勢の最初のものとし",
  "て、本作戦を天候の許す限り早期に",
  "実行する事に決定した。",
  "クルスク突出部に対する攻撃は、迅",
  "速かつ決定的に成功しなければなら",
  "ない。",
  "同盟",
  "Ｒ１―クルーゲ　ＡＧ",
]
en = [
  "^- Operation Citadel -",
  "I have decided to carry out this operation, the first offensive of the year, as soon as the weather permits.",
  "The attack on the Kursk salient must succeed quickly and decisively.",
  "<keep>",
  "Allies:",
  "R1 - Kluge AG",
]

[[briefing]]
block = "missions"
offset = 0x140D
index = [25]
jp = [
  "　　　　総統訓令第２２号",
  "軍事的に考えればイタリアの脱落は",
  "納得できる。だが、ドイツ将兵にお",
  "よぼす精神的影響は大きい。また戦",
  "略的にイタリアの位置は重要であり、",
  "イタリアを支援する事が必要なので",
  "ある。",
  "同盟",
  "Ｇ１―イタリア",
]
en = [
  "^Führer Directive No. 22",
  "Militarily, the defeat of Italy is understandable. But its effect on the morale of the German soldier is great.",
  "Strategically, Italy's position matters, and we must support her.",
  "<keep>",
  "Allies:",
  "G1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x14C8
index = [26]
jp = [
  "１１月１８日から始まった敵の攻勢",
  "―クルーセイダー作戦により、わが",
  "部隊は、再びエルアゲイラまで押し",
  "戻されていた。しかし、１月５日に",
  "ドイツ護送船団がトリポリへ到着、",
  "ロンメル将軍は反抗作戦を下令した。",
  "",
  "同盟",
  "Ｇ１―イタリア",
]
en = [
  "The enemy offensive Operation Crusader, begun on 18 November, has driven our units back to El Agheila.",
  "But on 5 January a German convoy reached Tripoli, and General Rommel has ordered a counterattack.",
  "<keep>",
  "Allies:",
  "G1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x1578
index = [27]
jp = [
  "英軍は、その兵力をギリシアや東ア",
  "フリカ方面へ分散し、弱体化にある。",
  "現在わが部隊は、エジプト国境を越",
  "えつつあり、戦力も優勢である。",
  "今こそ、北アフリカにおける英国の",
  "地歩を制し、その生命線とも言える",
  "スエズ運河を占領せよ。",
  "同盟",
  "Ｇ１―イタリア",
  "Ｙ１―ビシー　フランス",
]
en = [
  "The British have dispersed their forces to Greece and East Africa and are weakened. Our units are now crossing the Egyptian frontier, and we are the stronger side.",
  "Now break Britain's hold on North Africa and take her lifeline, Suez.",
  "<keep>",
  "Allies:",
  "G1 - Italy",
  "Y1 - Vichy France",
]

[[briefing]]
block = "missions"
offset = 0x1655
index = [28]
jp = [
  "イラクでクーデターにより反英派の",
  "ラシッド・アリが権力を握った。こ",
  "の政権を援助し、中東でのわが国の",
  "影響力を高める事は、石油資源の確",
  "保と英国の弱体化に不可欠である。",
  "また、バルバロッサ作戦の牽制とし",
  "て、アルメニア地方に攻撃すぺし。",
  "同盟",
  "Ｇ１―イタリア",
  "Ｇ２―ビシー　フランス",
  "Ｙ１―イラク",
  "Ｙ２―イラン",
]
en = [
  "A coup in Iraq has brought the anti-British Rashid Ali to power. Supporting his government and extending our influence in the Middle East is vital to secure oil and to weaken Britain.",
  "To support Barbarossa, also attack towards Armenia.",
  "<keep>",
  "Allies:",
  "G1 - Italy",
  "G2 - Vichy France",
  "Y1 - Iraq",
  "Y2 - Iran",
]

[[briefing]]
block = "missions"
offset = 0x1740
index = [29]
jp = [
  "英国はエル・アラメインという鉄道",
  "の駅一帯に撤退していた。ここから",
  "ナイル川までわずか１００ｋｍ。",
  "ムッソリーニは、自ら飛行機を飛ば",
  "し、アフリカに現れた。カイロ入城",
  "の時に乗る馬をつれて。",
  "",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "The British have fallen back to the area around El Alamein, a railway station only 100 km from the Nile.",
  "Mussolini has flown to Africa himself, bringing the horse he will ride when he enters Cairo.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x17E7
index = [30]
jp = [
  "わが国の戦争遂行上不可欠な石油資",
  "源を確保するため、キルクークを初",
  "めとする産油地帯を制圧せよ。",
  "また、中東における英軍の地歩を崩",
  "し、対ソ援助のイランルートを遮断、",
  "ブラウ作戦の側面的支援を期待する。",
  "",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "To secure the oil our war effort cannot do without, seize the oil region around Kirkuk.",
  "Break the British hold on the Middle East and cut the Iranian supply route to the Soviets, covering the flank of Operation Blue.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x18A0
index = [31]
jp = [
  "　　　　総統訓令第４１号",
  "　　　　―ブラウ作戦―",
  "ロシアにおける冬期戦終わりも近い。",
  "全兵力を南部作戦の主要に向け、コ",
  "ーカサス南方のアフリカ軍団と協力、",
  "油田地帯占領、及び敵戦力を撃破し",
  "ソ連の戦争離脱を促すものとす。",
  "同盟",
  "Ｒ１―Ａ／Ｂ　ＡＧ",
  "Ｒ２―トルコ",
]
en = [
  "^Führer Directive No. 41",
  "^- Operation Blue -",
  "The winter battle in Russia is nearing its end.",
  "All available forces are to be concentrated on the main operation in the south. Together with the Afrika Korps south of the Caucasus, take the oilfields, destroy the enemy and force the Soviets out of the war.",
  "<keep>",
  "Allies:",
  "R1 - A/B AG",
  "R2 - Turkey",
]

[[briefing]]
block = "missions"
offset = 0x1965
index = [32]
jp = [
  "連合軍のフランス領北アフリカへの",
  "上陸作戦―トーチ作戦が始まった。",
  "敵は、カサブランカ、オラン、アル",
  "ジェの３地区に上陸しつつある。",
  "ビシー政府ラバル首相は、わが国に",
  "チュニジアの飛行場の使用を許可し",
  "た。同地に、至急部隊を展開せよ。",
  "同盟",
  "Ｙ１―イタリア",
  "Ｙ２―ビシーフランス",
]
en = [
  "The Allied landing in French North Africa, Operation Torch, has begun, at Casablanca, Oran and Algiers.",
  "Laval, head of the Vichy government, has let us use the airfields in Tunisia. Deploy units there at once.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
  "Y2 - Vichy France",
]

[[briefing]]
block = "missions"
offset = 0x1A32
index = [33]
jp = [
  "シシリー島に連合軍の上陸作戦―ハ",
  "スキー作戦が開始された。",
  "同島の喪失は、イタリアの戦争離脱",
  "をうながし、イタリア南部への侵攻",
  "の拠点を敵に与える事になろう。",
  "可能な限り上陸を阻止し、これが無",
  "理な場合、部隊の温存に努めよ。",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "The Allied landing on Sicily, Operation Husky, has begun.",
  "The loss of the island would hasten Italy's exit from the war and give the enemy a base for the invasion of southern Italy.",
  "Stop the landing if at all possible; if not, preserve your units.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x1AFD
index = [34]
jp = [
  "敵の圧力により、早晩イタリアの降",
  "伏が予想される。イタリア軍寝返り",
  "の場合は、首都を支配下におくぺし。",
  "最初に最も危険が予想されるナポリ",
  "からサレルノに至る沿岸地域には有",
  "力な部隊を集結させておくものとす",
  "る。",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "Under enemy pressure, Italy is expected to surrender sooner or later. Should the Italian army change sides, take control of the capital.",
  "Assemble strong forces on the coast from Naples to Salerno, where the danger is greatest.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x1BC5
index = [35]
jp = [
  "敵はグスタフラインのカッシノ前面",
  "において攻勢に移った。また、アン",
  "ツィオに対し上陸作戦―シングル作",
  "戦を開始した。",
  "ここへの上陸は、敵のグスタフライ",
  "ンの喪失を意味する。全力をあげて",
  "敵の上陸作戦を阻止せよ。",
  "同盟",
  "Ｙ１―サロ　Ｒｅｐ．",
]
en = [
  "The enemy has gone over to the offensive at Cassino on the Gustav Line, and has begun a landing at Anzio, Operation Shingle.",
  "A landing there would mean the loss of the Gustav Line. Stop the landing with all your strength.",
  "<keep>",
  "Allies:",
  "Y1 - Salo Rep.",
]

[[briefing]]
block = "missions"
offset = 0x1C77
index = [36]
jp = [
  "ソ連における戦闘は、もはやわが国",
  "の勝利である。だが更にこの勝利を",
  "完全なものとするため、敵の政府組",
  "織のあるクイビシェフを占領し、ウ",
  "ラルの工業地帯を破壊する必要があ",
  "る。全軍は冬期においても、攻勢を",
  "続行し、ポルシェビキを全滅せよ。",
]
en = [
  "The battle in the Soviet Union is already ours. But to make the victory complete, we must take Kuibyshev, seat of the enemy government, and destroy the industry of the Urals.",
  "The whole army will keep up the offensive through the winter and wipe out the Bolsheviks.",
]

[[briefing]]
block = "missions"
offset = 0x1D48
index = [37]
jp = [
  "秋の日の　ヴィオロンの・・・",
  "とうとう連合軍のヨーロッパ反攻作",
  "戦―オーバーロード作戦が始まった。",
  "敵は、ノルマンディー地方に上陸を",
  "開始、降下部隊をともなう大規模な",
  "部隊を展開中。至急全隊出撃し、こ",
  "れを撃滅せよ。",
  "同盟",
  "Ｙ１―１ＳＳ　ＰｚＣｐ",
  "Ｙ２―８４ｔｈ　Ｃｐ",
]
en = [
  "The long sobs of the violins of autumn ...",
  "At last the Allied invasion, Operation Overlord, has begun.",
  "The enemy is landing in Normandy in strength, with airborne troops. Send out all units and destroy them.",
  "<keep>",
  "Allies:",
  "Y1 - 1st SS Pz Corps",
  "Y2 - 84th Corps",
]

[[briefing]]
block = "missions"
offset = 0x1E0F
index = [38]
jp = [
  "　　　―リュティヒ作戦―",
  "パットン第３軍がアブランシュを抜",
  "けて南下中である。そこを潰さなく",
  "ては、フランスの独軍戦線は総崩れ",
  "になる。全ての希望は、この作戦に",
  "かかっている。",
  "",
  "同盟",
  "Ｙ１―ブラスゴヴィッツ",
]
en = [
  "^- Operation Lüttich -",
  "Patton's Third Army has broken through at Avranches and is driving south. Unless it is crushed, the whole German front in France will collapse.",
  "Everything depends on this operation.",
  "<keep>",
  "Allies:",
  "Y1 - Blaskowitz",
]

[[briefing]]
block = "missions"
offset = 0x1EAD
index = [39]
jp = [
  "ライン川の渡河点を確保するため、",
  "連合軍の大規模な空挺作戦―マーケ",
  "ット・ガーデン作戦が始まった。",
  "アルンヘムにかかる橋の喪失は、ド",
  "イツ本国への敵侵攻をまねく。敵の",
  "渡河点確保を防ぎ、後続の本体であ",
  "る第３０軍団の前進を阻止せよ。",
  "同盟",
  "Ｙ１―１０７　Ｐｚ",
]
en = [
  "To seize the crossings over the Rhine, the Allies have launched a huge airborne operation, Market Garden.",
  "Losing the bridge at Arnhem would open Germany itself to invasion. Stop the enemy from taking the crossings and halt the advance of the main body, XXX Corps.",
  "<keep>",
  "Allies:",
  "Y1 - 107th Pz",
]

[[briefing]]
block = "missions"
offset = 0x1F81
index = [40]
jp = [
  "　　　―ラインの守り作戦―",
  "フランスはアメリカ軍にとって、巨",
  "大なワナとなろう。",
  "攻撃は、英軍を補給基地から遮断し、",
  "大陸から撤退させるために、ミュー",
  "ズ川を渡河後、アントワープを目指",
  "す予定である。",
]
en = [
  "^- Watch on the Rhine -",
  "France will become a huge trap for the American army.",
  "The attack will cross the Meuse and drive on Antwerp, to cut the British off from their supply bases and force them off the continent.",
]

[[briefing]]
block = "missions"
offset = 0x201E
index = [41]
jp = [
  "総統は東部戦線の重要な予備兵力―",
  "ワルシャワ地区から転出した兵力を",
  "加え、ブダペスト救出を命令した。",
  "前線部隊は守備隊の自力脱出を求め",
  "たが、総統は少しでも可能性のある",
  "うちは、ブダペストの再占領を要求",
  "した。",
  "同盟",
  "Ｙ１―ヴィルテンブルフ",
  "Ｙ２―ハンガリー",
]
en = [
  "The Führer has ordered the relief of Budapest, adding important reserves of the Eastern Front, forces taken from the Warsaw sector.",
  "The front-line commanders wanted the garrison to break out on its own, but the Führer demanded that Budapest be retaken while any chance remained.",
  "<keep>",
  "Allies:",
  "Y1 - Wildenbruch",
  "Y2 - Hungary",
]

[[briefing]]
block = "missions"
offset = 0x20EF
index = [42]
jp = [
  "ミナサン、コウウンヲイノル。",
  "",
  "　ＦＲＯＭ　トウキョウ",
  "　　　　　　ダイニッポンテイコク",
]
en = [
  "^GOOD LUCK TO YOU ALL.",
  "",
  "^FROM TOKYO,",
  "^GREAT JAPANESE EMPIRE",
]
