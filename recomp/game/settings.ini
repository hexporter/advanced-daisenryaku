# Runner settings for Advanced Daisenryaku (read from settings.ini next to ADRecomp).
# tools/build.sh copies this file into the build folder when none is there yet; a settings.ini
# changed there (launcher, in-game menu) is kept. Only the keys listed here change the defaults.
# Pad buttons are SDL game-controller numbers: 0 A, 1 B, 2 X, 3 Y (Xbox labels).

[input.p1]
# Xbox X → Genesis A, Xbox B → Genesis C (runner default: B → A, X → C), as in common emulator layouts.
pad.A = button:2
pad.B = button:0
pad.C = button:1
