  "を粉砕すぺし。",
  "",
  "同盟",
  "Ｒ１―クライスト",
  "Ｇ１―ハンガリー",
]
en = [
  "^Führer Directive No. 21",
  "^- Operation Barbarossa -",
  "The German Wehrmacht must be prepared to crush Soviet Russia in a rapid campaign, even before the end of the war against England.",
  "<page>",
  "The final objective is to cut Russia in two along the line Volga - Archangel.",
  "Your Army Group Centre will advance from the Warsaw area and destroy the enemy forces in Belorussia.",
  "<keep>",
  "Allies:",
  "R1 - Kleist",
  "G1 - Hungary",
]

[[briefing]]
block = "missions"
