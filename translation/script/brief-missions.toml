# Campaign mission briefings (block at $023EB6, docs/notes/briefings.md). Per entry: offset in the
# unpacked block, game table indices, jp rows (checked against the ROM; "" = blank row) and en.
# en items: "^text" centred row, "" blank row, "<page>" next page, "<keep>" rest on one page,
# anything else a paragraph (word-wrapped by tools/translate_rom.py). Terms: translation/glossary.md.

[[briefing]]
block = "missions"
offset = 0x0000
index = [0]
jp = [
  "　　　　総統訓令第１号",
  "　　　―ファル・ヴァイス―",
  "いまやドイツにとって忍ぶ事のでき",
  "ない東部国境の事態を、平和的手段",
  "によって処理できる全ての政治的可",
  "能性がつき果てた。よって私は実力",
  "にて解決する事を決意した。",
  "ポーランドへの攻撃は、すでにとと",
  "のえられた準備に従い実行される。",
  "攻撃の日は、１９３９年９月１日。",
  "攻撃の時間は、０４４５時。",
]
en = [
  "^Führer Directive No. 1",
  "^- Case White -",
  "Now that every political possibility of resolving by peaceful means the situation on the eastern frontier, which has become intolerable for Germany, has been exhausted, I have decided on a solution by force.",
  "The attack on Poland is to be carried out in accordance with the preparations already made.",
  "Date of attack: 1 September 1939.",
  "Time of attack: 04:45.",
]

[[briefing]]
block = "missions"
offset = 0x0126
index = [1]
jp = [
  "わが軍の戦車に対抗できる装備を持",
  "つ敵機甲部隊の進出が確認された。",
  "この部隊が拠点とするピョートルク",
  "フを占領し、バルダ川の渡河点を確",
  "保せよ。なお、橋のあたりでは激戦",
  "が予想される。",
]
en = [
  "Enemy armoured units equipped to take on our tanks have been reported advancing.",
  "Capture Piotrkow, the base of these units, and secure the crossing over the Warta. Heavy fighting is expected around the bridges.",
]

[[briefing]]
block = "missions"
offset = 0x01C9
index = [2]
jp = [
  "ワルシャワ包囲のため、その南方の",
  "ラドムに進出せよ。森がちな地形の",
  "ため進撃速度はにぶるが、敵拠点に",
  "戦力集中し、早期に占領の事。",
]
en = [
  "To encircle Warsaw, advance on Radom to the south of it.",
  "The wooded terrain will slow the advance, but concentrate your forces on the enemy strongholds and take them quickly.",
]

[[briefing]]
block = "missions"
offset = 0x023D
index = [3]
jp = [
  "ビスワ川でポーランド軍の残存部隊",
  "が反攻を開始した。第８軍は敗退、",
  "全滅の危機にある。ワルシャワヘの",
  "攻撃は一時中断し、第４軍と協力し",
  "つつ、これを包囲攻撃せよ。",
  "同盟",
  "Ｒ１―４ｔｈ　Ａｒｍｙ",
]
en = [
  "The remnants of the Polish army have launched a counterattack on the Vistula. The Eighth Army has been beaten back and faces annihilation.",
  "Halt the attack on Warsaw for now and, together with the Fourth Army, encircle and destroy the enemy.",
  "<keep>",
  "Allies:",
  "R1 - 4th Army",
]

[[briefing]]
block = "missions"
offset = 0x02D6
index = [4]
jp = [
  "敵首都ワルシャワは包囲されたが、",
  "まだ強力な部隊が守備している。",
  "特に第一次攻撃は、陣地にある対戦",
  "車砲のため、失敗に終っている。",
  "空からの支援を得つつ、市街に突入",
  "し敵首都を占領せよ。",
]
en = [
  "The enemy capital Warsaw is surrounded, but strong forces still hold it. The first assault failed against the anti-tank guns in their positions.",
  "With support from the air, storm the city and take the enemy capital.",
]

[[briefing]]
block = "missions"
offset = 0x037D
index = [5]
jp = [
  "ノルウェー侵攻作戦の後方連絡線を",
  "安全にするため、デンマークをすみ",
  "やかに占領せよ。",
]
en = [
  "To secure the lines of communication of the invasion of Norway, occupy Denmark without delay.",
]

[[briefing]]
block = "missions"
offset = 0x03C3
index = [6]
jp = [
  "―ファル・ヴェーゼルユーブング―",
  "情報によれば、英軍がノルウェー上",
  "陸を計画している。英軍のノルウェ",
  "ー占領は、戦略的う回行動で、そこ",
  "からバルト諸国へ侵入するだろう。",
  "そうなれば敵はベルリンへ進撃が可",
  "能となる。",
  "よってノルウェー侵攻を命令する。",
  "同盟",
  "Ｒ１―サンガク　シダン",
]
en = [
  "^- Weserübung -",
  "Intelligence reports that the British are planning a landing in Norway. A British occupation of Norway would be a strategic outflanking move, opening the way into the Baltic states.",
  "The enemy could then advance on Berlin. I therefore order the invasion of Norway.",
  "<keep>",
  "Allies:",
  "R1 - Mountain Division",
]

[[briefing]]
block = "missions"
offset = 0x049B
index = [7]
jp = [
  "　　　　総統訓令第６号",
  "　　　―ファル・ゲルプ―",
  "近い将来において、イギリス及びそ",
  "の影響下にあるフランスもまた、戦",
  "争を終結させようとしないならば、",
  "私は、時を失する事なく、攻勢に移",
  "ることに決定した。",
]
en = [
  "^Führer Directive No. 6",
  "^- Case Yellow -",
  "Should Britain, and France under her influence, refuse in the near future to end the war, I am resolved to take the offensive without delay.",
]

[[briefing]]
block = "missions"
offset = 0x0545
index = [8]
jp = [
  "　　　―ファル・ロート―",
  "フランスに最後の一撃を加えるため",
  "ソンム戦線を突破、パリを占領せよ。",
  "ダンケルクより撤退した英軍が再び",
  "援軍を送りつつあるが、もはやフラ",
  "ンスに予備軍はない。",
  "なお、イタリアが参戦するであろう。",
  "同盟",
  "Ｒ１―レープ",
  "Ｙ１―イタリア",
]
en = [
  "^- Case Red -",
  "To deal France the final blow, break through the Somme front and take Paris.",
  "The British who escaped from Dunkirk are sending reinforcements again, but France has no reserves left. Italy is expected to enter the war.",
  "<keep>",
  "Allies:",
  "R1 - Leeb",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x060B
index = [9]
jp = [
  "　　　―ファル・ロート―",
  "フランスに最後の一撃を加えるため",
  "マジノ要塞を攻撃せよ。ここを抜け",
  "ば、パリの敵軍は北からのボック将",
  "軍の部隊と包囲できるであろう。",
  "また、イタリアが連合国に宣戦し、",
  "南仏に進出してくるであろう。",
  "同盟",
  "Ｒ１―ボック",
  "Ｙ１―イタリア",
]
en = [
  "^- Case Red -",
  "To deal France the final blow, attack the Maginot Line. Once it is broken, the enemy around Paris can be encircled together with General Bock's forces from the north.",
  "Italy is expected to declare war on the Allies and advance into southern France.",
  "<keep>",
  "Allies:",
  "R1 - Bock",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x06D9
index = [10]
jp = [
  "英本土上陸作戦を行うにあたって、",
  "あらかじめ制空権を握る必要がある。",
  "イギリスはソ連の援助をあてに戦っ",
  "ているにすぎない。",
  "すみやかに敵空軍勢力を粉砕せよ。",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "Before the landing in England we must first win command of the air.",
  "Britain fights on only in the hope of Soviet help.",
  "Destroy the enemy air force without delay.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x0773
index = [11]
jp = [
  "　　　　総統訓令第１６号",
  "　　―ゼー・レーヴェ作戦―",
  "私はイギリス侵入を準備し、必要と",
  "なればこれの実行を決定した。その",
  "達成には、航空戦が重要である。",
  "上陸作戦は、イギリス南部海岸のい",
  "たるところで行われるものとする。",
  "同盟",
  "Ｙ１―イタリア",
]
en = [
  "^Führer Directive No. 16",
  "^- Operation Sea Lion -",
  "I have decided to prepare a landing operation against England and, if necessary, to carry it out. The air war is vital to its success.",
  "The landing will take place on a broad front along the south coast of England.",
  "<keep>",
  "Allies:",
  "Y1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x0834
index = [12]
jp = [
  "　　　　総統訓令第２５号",
  "　　　　―マリ―タ作戦―",
  "わが同盟国のユーゴスラビアでクー",
  "デターが発生し、反同盟派のシモビ",
  "ッチが政権を握った。",
  "直ちに軍事的に、そして国家として",
  "のユーゴスラビアを粉砕する。",
  "なおこの作戦のため、バルバロッサ",
  "作戦を延期せざるをえないであろう。",
  "同盟",
  "Ｒ１―クライスト",
  "Ｒ２―ハンガリー",
  "Ｇ１―イタリア",
  "Ｇ２―イタリア",
]
en = [
  "^Führer Directive No. 25",
  "^- Operation Marita -",
  "A coup in our ally Yugoslavia has brought the anti-Axis Simovic to power.",
  "Yugoslavia is to be crushed at once, militarily and as a state.",
  "Because of this operation, Barbarossa will have to be postponed.",
  "<keep>",
  "Allies:",
  "R1 - Kleist",
  "R2 - Hungary",
  "G1 - Italy",
  "G2 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x0931
index = [13, 43]
jp = [
  "　　　　総統訓令第２５号",
  "　　　　―マリ―タ作戦―",
  "わが同盟国のユーゴスラビアでクー",
  "デターが発生し、反同盟派のシモビ",
  "ッチが政権を握った。",
  "直ちに軍事的に、そして国家として",
  "のユーゴスラビアを粉砕する。",
  "また、ギリシア侵入も同時に行う。",
  "なおこの作戦のため、バルバロッサ",
  "作戦を延期せざるをえないであろう。",
  "同盟",
  "Ｒ１―イタリア",
]
en = [
  "^Führer Directive No. 25",
  "^- Operation Marita -",
  "A coup in our ally Yugoslavia has brought the anti-Axis Simovic to power.",
  "Yugoslavia is to be crushed at once, militarily and as a state. Greece is to be invaded at the same time.",
  "Because of this operation, Barbarossa will have to be postponed.",
  "<keep>",
  "Allies:",
  "R1 - Italy",
]

[[briefing]]
block = "missions"
offset = 0x0A31
index = [14]
jp = [
  "　　　　総統訓令第２１号",
  "　　　―バルバロッサ作戦―",
  "ドイツ国防軍は、イギリスに対する",
  "戦争の終結以前においても、ソ連を",
  "迅速な一戦役によって、破砕するこ",
  "とを準備しなければならない。",
  "",
  "作戦の主要目的はヴォルガ―アルハ",
  "ンゲリスクの線でロシアを二分する",
  "事にあり。",
  "貴下の北方軍集団は、東プロイセン",
  "より進出、バルト地区の敵兵力を壊",
  "滅させ、レニングラードを占領すぺ",
  "し。",
  "同盟",
  "Ｇ１―フィンランド",
]
en = [
  "^Führer Directive No. 21",
  "^- Operation Barbarossa -",
  "The German Wehrmacht must be prepared to crush Soviet Russia in a rapid campaign, even before the end of the war against England.",
  "<page>",
  "The final objective is to cut Russia in two along the line Volga - Archangel.",
  "Your Army Group North will advance from East Prussia, destroy the enemy forces in the Baltic area and take Leningrad.",
  "<keep>",
  "Allies:",
  "G1 - Finland",
]

